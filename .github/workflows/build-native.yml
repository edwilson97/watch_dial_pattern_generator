name: Build native apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    environment: native-signing
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Check Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Set the $name secret in the native-signing GitHub environment."
            }
          }
          foreach ($name in 'AZURE_SIGNING_ACCOUNT_NAME', 'AZURE_CERTIFICATE_PROFILE_NAME', 'AZURE_SIGNING_ENDPOINT') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Set the $name configuration variable in the native-signing GitHub environment."
            }
          }
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test geometry, exports, and bundle helpers
        run: >-
          python -m unittest
          tests.test_geometry tests.test_distinct_lattices
          tests.test_fishscales_relief tests.test_brick tests.test_dimples tests.test_ingenieur
          tests.test_exclusion_zones tests.test_relief_inspection tests.test_packaging -v
      - name: Prepare isolated Windows viewer Python
        if: runner.os == 'Windows'
        id: viewer-python
        shell: pwsh
        run: |
          $viewerRoot = Join-Path $env:RUNNER_TEMP 'windows-viewer-python'
          $pythonHome = python -c 'import sys; print(sys.base_prefix)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the Python runtime.' }
          New-Item -ItemType Directory -Force -Path $viewerRoot | Out-Null
          # Copy the real interpreter, not a venv redirector that launches the
          # original executable and would bypass the adjacent Mesa libraries.
          Copy-Item -LiteralPath (Join-Path $pythonHome 'python.exe') -Destination $viewerRoot
          Get-ChildItem -LiteralPath $pythonHome -Filter '*.dll' | Copy-Item -Destination $viewerRoot
          "scripts=$viewerRoot" >> $env:GITHUB_OUTPUT
          "home=$pythonHome" >> $env:GITHUB_OUTPUT
      - name: Install software OpenGL for Windows viewer tests
        if: runner.os == 'Windows'
        uses: f3d-app/install-mesa-windows-action@b78081f8331c5d49d71b221ca13a25fd97dac165
        with:
          version: '23.3.5'
          path: ${{ steps.viewer-python.outputs.scripts }}
      - name: Verify Windows native software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VTK_DEFAULT_OPENGL_WINDOW: vtkWin32OpenGLRenderWindow
          PYTHONHOME: ${{ steps.viewer-python.outputs.home }}
        run: |
          & '${{ steps.viewer-python.outputs.scripts }}\python.exe' scripts/check_native_opengl.py
          if ($LASTEXITCODE -ne 0) { throw 'Native software OpenGL initialization failed.' }
      - name: Test Windows live viewer updates
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VTK_DEFAULT_OPENGL_WINDOW: vtkWin32OpenGLRenderWindow
          PYTHONHOME: ${{ steps.viewer-python.outputs.home }}
        run: |
          & '${{ steps.viewer-python.outputs.scripts }}\python.exe' -m unittest tests.test_pyvista_viewer.UpdateTests tests.test_pyvista_viewer.MeshTests.test_native_viewer_polls_changes_after_startup -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows live viewer tests failed.' }
      - name: Clean up Windows viewer graphics environment
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-viewer-python') -Recurse -Force -ErrorAction SilentlyContinue
          'GALLIUM_DRIVER=' >> $env:GITHUB_ENV
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?Set the MACOS_CERTIFICATE_P12_BASE64 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set the MACOS_CERTIFICATE_PASSWORD secret}"
          : "${MACOS_SIGNING_IDENTITY:?Set the MACOS_SIGNING_IDENTITY secret}"
          case "$MACOS_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "MACOS_SIGNING_IDENTITY must be the full Developer ID Application identity." >&2; exit 1 ;;
          esac
          umask 077
          certificate="$RUNNER_TEMP/macos-signing.p12"
          keychain="$RUNNER_TEMP/macos-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Build desktop app
        env:
          MACOS_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
        run: python -m PyInstaller --clean --noconfirm WatchDialPatternGenerator.spec
      - name: Sign in to Azure with GitHub OIDC
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executable
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\WatchDialPatternGenerator\WatchDialPatternGenerator.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Watch Dial Pattern Generator
          description-url: https://github.com/edwilson97/watch_dial_pattern_generator
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify Windows signature and timestamp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'dist/WatchDialPatternGenerator/WatchDialPatternGenerator.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows signature verification failed: $($signature.Status) - $($signature.StatusMessage)"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'The Windows executable must have a timestamped signature.'
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"
      - name: Verify Developer ID signature
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --verify --deep --strict --verbose=2 dist/WatchDialPatternGenerator.app
          codesign --display --verbose=4 dist/WatchDialPatternGenerator.app 2> "$RUNNER_TEMP/macos-signature.txt"
          grep -Fqx "Authority=$MACOS_SIGNING_IDENTITY" "$RUNNER_TEMP/macos-signature.txt"
      - name: Smoke test packaged app
        run: python scripts/check_bundle.py
      - name: Record bundled dependencies
        shell: bash
        run: python -m pip freeze > dist/dependencies.txt
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path dist/WatchDialPatternGenerator,dist/dependencies.txt
          -DestinationPath dist/WatchDialPatternGenerator-${{ matrix.platform }}.zip
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir dist/package
          mv dist/WatchDialPatternGenerator.app dist/dependencies.txt dist/package/
          ditto -c -k --sequesterRsrc dist/package dist/WatchDialPatternGenerator-${{ matrix.platform }}.zip
      - name: Verify macOS archive extraction
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/WatchDialPatternGenerator-${{ matrix.platform }}.zip "$RUNNER_TEMP/archive-check"
          test -x "$RUNNER_TEMP/archive-check/WatchDialPatternGenerator.app/Contents/MacOS/WatchDialPatternGenerator"
          codesign --verify --deep --strict "$RUNNER_TEMP/archive-check/WatchDialPatternGenerator.app"
      - name: Upload download
        uses: actions/upload-artifact@v7
        with:
          path: dist/WatchDialPatternGenerator-${{ matrix.platform }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Clean up macOS signing credentials
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          if [[ -f "$RUNNER_TEMP/macos-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/macos-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/macos-signing.p12"
